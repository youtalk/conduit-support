# Conduit robot harness (Conduit 3.0 Robots, spec §12.3).
#
# Linux hosts only (youtalk-desktop): DDS from the phone needs host networking,
# which Docker Desktop on macOS does not provide.
#
# Build once (from this directory):
#   docker compose -f compose-robot-harness.yml build
# Fake mobile robot + conduit_teleop:
#   docker compose -f compose-robot-harness.yml --profile mobile up -d
# MoveIt Servo Panda + gripper action server:
#   docker compose -f compose-robot-harness.yml --profile arm up -d
# Gate probe in the foreground (Ctrl-C writes a JSON report to robot-harness/reports/):
#   docker compose -f compose-robot-harness.yml --profile probe up
# Over Zenoh instead of DDS (Conduit's router locator: tcp/<host-ip>:7447):
#   HARNESS_RMW=rmw_zenoh_cpp docker compose -f compose-robot-harness.yml --profile zenoh --profile mobile up -d
# A shell with the workspace sourced:
#   docker compose -f compose-robot-harness.yml run --rm shell
#
# Environment (all optional):
#   ROS_DOMAIN_ID     default 123
#   HARNESS_RMW       rmw_cyclonedds_cpp (default) or rmw_zenoh_cpp
#   CONDUIT_PHONE_IP  phone or simulator-Mac IP, added as a DDS unicast peer
#   JOY_TOPIC         Joy topic conduit_teleop reads, default /joy
#                     (/conduit/joy for Conduit's Game Controller sensor)
#   PHONE_OFFSET_NS   phone clock offset for the probe (host - phone), from conduit_gate_ping

x-harness: &harness
  image: conduit-robot-harness:jazzy
  build:
    context: ..
    dockerfile: docker/robot-harness/Dockerfile
  network_mode: host
  environment:
    - RMW_IMPLEMENTATION=${HARNESS_RMW:-rmw_cyclonedds_cpp}
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-123}
    - CYCLONEDDS_URI=file:///etc/cyclonedds/cyclonedds.xml
    - CONDUIT_PHONE_IP=${CONDUIT_PHONE_IP:-localhost}
  volumes:
    - ./robot-harness/cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
    - ./robot-harness/reports:/reports

services:
  zenohd:
    <<: *harness
    profiles: [zenoh]
    container_name: conduit_harness_zenohd
    command: ros2 run rmw_zenoh_cpp rmw_zenohd

  fake-robot:
    <<: *harness
    profiles: [mobile]
    container_name: conduit_harness_mobile
    command: ros2 launch conduit_robot_harness fake_mobile_robot.launch.py joy_topic:=${JOY_TOPIC:-/joy}

  servo-panda:
    <<: *harness
    profiles: [arm]
    container_name: conduit_harness_arm
    command: ros2 launch conduit_robot_harness servo_panda.launch.py

  gate-probe:
    <<: *harness
    profiles: [probe]
    container_name: conduit_harness_probe
    command: >-
      ros2 run conduit_gate_probe conduit_gate_probe --ros-args
      -p report_dir:=/reports
      -p joy_topic:=${JOY_TOPIC:-/joy}
      -p phone_offset_ns:=${PHONE_OFFSET_NS:-0}

  shell:
    <<: *harness
    profiles: [shell]
    stdin_open: true
    tty: true
    command: bash
