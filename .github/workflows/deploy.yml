name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
      - run: pip install -r requirements.txt
      # tests/pair/test_embedded_qr.py decodes the QR with zbarimg.
      - name: Install bats and zbar
        run: sudo apt-get update && sudo apt-get install -y bats zbar-tools
      - run: python -m pytest tests/ -v
      - run: shellcheck pair/pair.sh
      - run: bats tests/pair
      # ROS 2 Humble on RHEL 8 runs the embedded Python on Python 3.6.
      - name: Embedded Python runs on Python 3.6 (RHEL 8)
        run: docker run --rm -v "$PWD:/w:ro" -w /w rockylinux:8 /usr/libexec/platform-python tests/pair/smoke/embedded_py36.py pair/pair.sh
      - name: Test conduit_teleop (pure Python, no ROS)
        working-directory: ros/conduit_teleop
        run: python -m pytest test -v
      - name: Test conduit_demo (pure Python, no ROS)
        working-directory: ros/conduit_demo
        run: |
          pip install numpy
          python -m pytest test -v
      - name: Copy the pairing script into docs/ so MkDocs publishes it
        run: cp pair/pair.sh docs/pair.sh
      - run: mkdocs build --strict

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify CNAME present in source
        run: test -f CNAME
      - name: Copy CNAME into docs/ so MkDocs publishes it
        run: cp CNAME docs/CNAME
      - name: Copy the pairing script into docs/ so MkDocs publishes it
        run: cp pair/pair.sh docs/pair.sh
      - run: mkdocs gh-deploy --force
