name: Connection Issue
description: Report network, router or discovery problems (Zenoh or DDS)
title: "[Connection]: "
labels: ["connection", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Experiencing connection issues? Please provide detailed information to help us diagnose the problem.

        **Tip**: If you connected with a QR code, the pairing script prints what to check. See [Connect with a QR code](https://conduit.direct/pair/) and [Troubleshooting](https://conduit.direct/troubleshooting/).

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: Which version of Conduit are you using? See Settings → About & Help.
      placeholder: "2.6.0"
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Transport
      description: Which transport is selected in Conduit's Settings → Transport?
      options:
        - Zenoh
        - DDS
    validations:
      required: true

  - type: dropdown
    id: pairing
    attributes:
      label: QR Code Pairing
      description: Did you set up the connection with the QR code script (Conduit 2.6.0 or later)?
      options:
        - "Yes"
        - "No, I entered the settings by hand"
    validations:
      required: false

  - type: input
    id: router-address
    attributes:
      label: Router Address (Zenoh only)
      description: The Router Address and Router Port in Conduit's Settings. Leave empty for DDS.
      placeholder: "192.168.1.100:7447"
    validations:
      required: false

  - type: dropdown
    id: router-status
    attributes:
      label: Zenoh Router Status (Zenoh only)
      description: Is rmw_zenohd running on your ROS 2 system?
      options:
        - Yes, confirmed running
        - Not sure
        - No, not running
        - Not applicable (DDS)
    validations:
      required: false

  - type: input
    id: dds-peers
    attributes:
      label: DDS Peers (DDS only)
      description: The peers in Conduit's Settings → Discovery. Write "none" if the list is empty (multicast only). Leave empty for Zenoh.
      placeholder: "192.168.1.100"
    validations:
      required: false

  - type: input
    id: dds-network-interface
    attributes:
      label: DDS Network Interface (DDS only)
      description: The Network Interface in Conduit's Settings → Discovery. Leave empty for Zenoh.
      placeholder: "en0 (WiFi)"
    validations:
      required: false

  - type: textarea
    id: cyclonedds-uri
    attributes:
      label: Host CYCLONEDDS_URI (DDS only)
      description: The value of CYCLONEDDS_URI on the ROS 2 host, if set. Leave empty for Zenoh.
      render: xml
    validations:
      required: false

  - type: input
    id: domain-id
    attributes:
      label: Domain ID
      description: The Domain ID in Conduit's Settings, and ROS_DOMAIN_ID on the host.
      placeholder: "Conduit: 0, host ROS_DOMAIN_ID: 0"
    validations:
      required: true

  - type: dropdown
    id: wire-mode
    attributes:
      label: Distribution Setting
      description: Which distribution is selected in Conduit's Settings → Distribution?
      options:
        - Humble
        - Jazzy
        - Kilted
        - Lyrical
        - Rolling
    validations:
      required: true

  - type: dropdown
    id: ros-version
    attributes:
      label: ROS 2 Version
      description: Which ROS 2 version is running on your system?
      options:
        - ROS 2 Humble
        - ROS 2 Jazzy
        - ROS 2 Kilted
        - ROS 2 Lyrical
        - ROS 2 Rolling
        - Other
    validations:
      required: true

  - type: input
    id: rmw-implementation
    attributes:
      label: RMW_IMPLEMENTATION on the host
      description: The value of RMW_IMPLEMENTATION on the ROS 2 host.
      placeholder: "rmw_zenoh_cpp, rmw_cyclonedds_cpp, unset"
    validations:
      required: false

  - type: dropdown
    id: network-type
    attributes:
      label: Network Type
      description: How are your devices connected?
      options:
        - Wi-Fi (same network)
        - Wi-Fi (different subnets)
        - Ethernet
        - Tailscale
        - Cellular
        - Other
    validations:
      required: true

  - type: textarea
    id: error-message
    attributes:
      label: Error Message
      description: What error message does the app show?
      placeholder: "Connection Failed: ..."
      render: text
    validations:
      required: true

  - type: textarea
    id: network-setup
    attributes:
      label: Network Setup
      description: Describe your network configuration
      placeholder: |
        - iPhone / iPad / Mac IP: 192.168.1.50
        - ROS 2 system IP: 192.168.1.100
        - Firewall on the ROS 2 system: enabled/disabled
        - Guest or office Wi-Fi: yes/no
    validations:
      required: false

  - type: textarea
    id: troubleshooting-tried
    attributes:
      label: Troubleshooting Steps Tried
      description: What have you already tried?
      placeholder: |
        - Zenoh: verified the router is running (ros2 run rmw_zenoh_cpp rmw_zenohd)
        - DDS: added the device's address as a peer on the host and ran ros2 daemon stop
        - Confirmed devices on the same network
        - Checked firewall settings
    validations:
      required: false

  - type: textarea
    id: router-logs
    attributes:
      label: Logs (if available)
      description: Any relevant output from rmw_zenohd, the pairing script, or ros2 commands on the host
      render: shell
    validations:
      required: false
